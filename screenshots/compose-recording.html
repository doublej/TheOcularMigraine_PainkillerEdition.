<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 560px;
    height: 960px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    overflow: hidden;
  }
  .device-frame {
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 40px 80px -20px rgba(0,0,0,0.5),
      0 16px 32px -8px rgba(0,0,0,0.3),
      0 4px 8px rgba(0,0,0,0.15);
  }
  .device-frame img {
    display: block;
    height: 864px;
    width: auto;
  }
</style>
</head>
<body>
  <div class="device-frame">
    <img src="raw/recording.png" alt="">
  </div>
</body>
</html>
